name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *" 
  workflow_dispatch:

permissions: 
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2

      - uses: Platane/snk@v3
        with:
          # github user name to read the contribution graph from (**required**)
          github_user_name: salik702

          # list of files to generate.
          outputs: |
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=#ffffff,#d4f0f0,#8accff,#3399ff,#0044cc&color_snake=#00D9FF
            dist/github-contribution-grid-snake-dark.svg?palette=#161b22,#00384d,#006d99,#00a1e6,#00d9ff&color_snake=#00D9FF

      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
