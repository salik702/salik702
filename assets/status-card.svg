<svg width="840" height="420" viewBox="0 0 840 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .text { font-family: 'Consolas', 'Monaco', 'Andale Mono', 'Ubuntu Mono', monospace; fill: #E0E0E0; font-size: 14px; opacity: 0; animation: fadeIn 0.5s forwards; }
    .key { font-family: 'Consolas', monospace; fill: #4DDBFF; font-weight: bold; opacity: 0; animation: fadeIn 0.5s forwards; }
    .string { fill: #CE9178; opacity: 0; animation: fadeIn 0.5s forwards; }
    .bracket { fill: #FFD700; opacity: 0; animation: fadeIn 0.5s forwards; }
    
    .cursor { animation: blink 1s step-end infinite; fill: #E0E0E0; }
    @keyframes blink { 50% { opacity: 0; } }
    
    @keyframes fadeIn { to { opacity: 1; } }
    
    /* Staggered animation delays */
    .line-1 { animation-delay: 0.2s; }
    .line-2 { animation-delay: 0.5s; }
    .line-3 { animation-delay: 0.6s; }
    .line-4 { animation-delay: 0.9s; }
    .line-5 { animation-delay: 1.0s; }
    .line-6 { animation-delay: 1.3s; }
    .line-7 { animation-delay: 1.4s; }
    .line-8 { animation-delay: 1.7s; }
    .line-9 { animation-delay: 1.8s; }
    .line-10 { animation-delay: 2.1s; }
    .line-11 { animation-delay: 2.2s; }
    .line-12 { animation-delay: 2.5s; }
    .line-13 { animation-delay: 2.6s; }
    .line-14 { animation-delay: 2.9s; }
    .line-15 { animation-delay: 3.2s; }
    
    /* Grid Animation */
    @keyframes gridMove {
      0% { transform: translateY(0); }
      100% { transform: translateY(40px); }
    }
  </style>

  <!-- Dark Background -->
  <rect width="840" height="420" fill="#0D1117" rx="10" />
  
  <!-- Subtle Grid Pattern Background -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#30363D" stroke-width="1" opacity="0.4"/>
    </pattern>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00D9FF;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#bd34fe;stop-opacity:0.1" />
    </linearGradient>
  </defs>
  
  <rect width="840" height="420" fill="url(#grid)" rx="10" />
  <rect width="840" height="420" fill="url(#glow)" rx="10" />

  <!-- Window Controls -->
  <g transform="translate(20, 20)">
    <circle cx="0" cy="0" r="6" fill="#FF5F56" />
    <circle cx="20" cy="0" r="6" fill="#FFBD2E" />
    <circle cx="40" cy="0" r="6" fill="#27C93F" />
    <text x="60" y="5" class="text" font-weight="bold" fill="#8B949E" style="font-size: 12px; font-family: sans-serif; opacity: 0.8">salik_status.json</text>
  </g>

  <!-- Code Content (Left Side) -->
  <g transform="translate(30, 60)">
    <text x="0" y="0" class="bracket line-1">{</text>
    
    <!-- Focus -->
    <text x="20" y="30" class="key line-2">"current_focus":</text>
    <text x="160" y="30" class="string line-3">"Deep Learning & Generative AI"</text>
    <text x="500" y="30" class="text line-3">,</text>

    <!-- Deep Dive -->
    <text x="20" y="60" class="key line-4">"deep_dive":</text>
    <text x="160" y="60" class="string line-5">"Transformers, LLMs, Diffusion"</text>
    <text x="500" y="60" class="text line-5">,</text>

    <!-- Collaborate -->
    <text x="20" y="90" class="key line-6">"collaborate":</text>
    <text x="160" y="90" class="string line-7">"Research Papers, Open Source"</text>
    <text x="500" y="90" class="text line-7">,</text>

    <!-- Learning -->
    <text x="20" y="120" class="key line-8">"learning":</text>
    <text x="160" y="120" class="string line-9">"Reinforcement Learning, MLOps"</text>
    <text x="500" y="120" class="text line-9">,</text>
    
    <!-- Ask Me -->
    <text x="20" y="150" class="key line-10">"ask_me_about":</text>
    <text x="160" y="150" class="string line-11">"Model Opt., Neural Arch."</text>
    <text x="500" y="150" class="text line-11">,</text>

    <!-- Fun Fact -->
    <text x="20" y="180" class="key line-12">"fun_fact":</text>
    <text x="160" y="180" class="string line-13">"I debug with Rubber Ducks 🦆"</text>
    <text x="500" y="180" class="text line-13">,</text>
    
    <!-- Location -->
    <text x="20" y="210" class="key line-14">"location":</text>
    <text x="160" y="210" class="string line-15">"Pakistan"</text>
    
    <text x="0" y="250" class="bracket line-15">}</text>
    
    <!-- Cursor -->
    <rect x="10" y="238" width="10" height="18" class="cursor" />
  </g>

  <!-- Right Side Decorative Element (Abstract AI Brain/Network) -->
  <g transform="translate(620, 100)" opacity="0.8">
     <!-- Hexagon Shape 1 -->
     <path d="M50 0 L93.3 25 L93.3 75 L50 100 L6.7 75 L6.7 25 Z" fill="none" stroke="#00D9FF" stroke-width="2">
        <animate attributeName="stroke-opacity" values="0.3;1;0.3" duration="3s" repeatCount="indefinite" />
     </path>
     <!-- Hexagon Shape 2 (Offset) -->
     <path d="M50 0 L93.3 25 L93.3 75 L50 100 L6.7 75 L6.7 25 Z" fill="none" stroke="#bd34fe" stroke-width="2" transform="translate(40, 60)">
        <animate attributeName="stroke-opacity" values="1;0.3;1" duration="3s" repeatCount="indefinite" />
     </path>
      <!-- Connection Lines -->
     <line x1="50" y1="50" x2="90" y2="110" stroke="#E0E0E0" stroke-width="1" stroke-dasharray="5,5" opacity="0.5" />
     <circle cx="50" cy="50" r="4" fill="#00D9FF" />
     <circle cx="90" cy="110" r="4" fill="#bd34fe" />
  </g>

</svg>