<svg width="840" height="420" viewBox="0 0 840 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .text { font-family: 'Segoe UI', Ubuntu, Sans-Serif; fill: #E0E0E0; font-size: 14px; }
    .key { font-family: 'Courier New', Courier, monospace; fill: #4DDBFF; font-weight: bold; }
    .string { fill: #CE9178; }
    .comment { fill: #6A9955; font-style: italic; }
    .cursor { animation: blink 1s step-end infinite; fill: #E0E0E0; }
    @keyframes blink { 50% { opacity: 0; } }
    .card-bg { fill: #0D1117; stroke: #30363D; stroke-width: 1; }
    .header-dot { r: 6; }
    .red { fill: #FF5F56; }
    .yellow { fill: #FFBD2E; }
    .green { fill: #27C93F; }
  </style>
  
  <rect x="0" y="0" width="840" height="420" rx="15" class="card-bg" fill="#0D1117" />
  
  <!-- Window Controls -->
  <circle cx="20" cy="20" class="header-dot red" />
  <circle cx="40" cy="20" class="header-dot yellow" />
  <circle cx="60" cy="20" class="header-dot green" />
  
  <!-- Title -->
  <text x="50%" y="25" text-anchor="middle" class="text" font-weight="bold" fill="#8B949E">salik_status.json</text>
  
  <!-- Content -->
  <g transform="translate(30, 60)">
    <text x="0" y="0" class="text">{</text>
    
    <!-- Currently Working On -->
    <text x="20" y="30" class="key">"current_focus":</text>
    <text x="170" y="30" class="text string">"Advanced ML, Predictive Analytics, RecSys, Deep Learning"</text>
    <text x="630" y="30" class="text">,</text>

    <!-- Deep Diving Into -->
    <text x="20" y="60" class="key">"deep_diving":</text>
    <text x="170" y="60" class="text string">"Transformers, GANs, Diffusion Models, LLM Fine-tuning"</text>
    <text x="630" y="60" class="text">,</text>

    <!-- Collaborate -->
    <text x="20" y="90" class="key">"collaborate_on":</text>
    <text x="180" y="90" class="text string">"Open Source ML, AI Research, Innovative Startups"</text>
    <text x="630" y="90" class="text">,</text>

    <!-- Learning -->
    <text x="20" y="120" class="key">"learning":</text>
    <text x="170" y="120" class="text string">"Deep Learning, Neural Networks, GenAI, RL"</text>
    <text x="630" y="120" class="text">,</text>
    
    <!-- Ask Me About -->
    <text x="20" y="150" class="key">"ask_me_about":</text>
    <text x="170" y="150" class="text string">"ML Algos, Optimization, Feature Engineering"</text>
    <text x="630" y="150" class="text">,</text>

    <!-- Fun Fact -->
    <text x="20" y="180" class="key">"fun_fact":</text>
    <text x="170" y="180" class="text string">"I believe in coding daily - consistency is key!"</text>
    <text x="630" y="180" class="text">,</text>
    
    <!-- Debugging Style -->
    <text x="20" y="210" class="key">"debugging_tool":</text>
    <text x="190" y="210" class="text string">"Rubber Ducks 🦆"</text>
    
    <text x="0" y="250" class="text">}</text>
    
    <!-- Cursor at the end -->
    <rect x="10" y="238" width="10" height="18" class="cursor" />
  </g>
  
  <!-- Decorative/Animation subtle -->
  <rect x="0" y="415" width="840" height="5" fill="url(#grad1)">
    <animate attributeName="width" values="0;840" duration="2s" fill="freeze" />
  </rect>
  
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00D9FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#bd34fe;stop-opacity:1" />
    </linearGradient>
  </defs>
</svg>
